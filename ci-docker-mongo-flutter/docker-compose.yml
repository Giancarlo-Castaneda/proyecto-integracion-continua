services:
  mongo:
    image: mongo:6
    container_name: mongo
    environment:
      MONGO_INITDB_DATABASE: appdb
    volumes:
      - mongo_data:/data/db
    networks:
      - appnet
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 })' | mongosh --quiet"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    container_name: backend
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      MONGO_DB: "appdb"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  flutter_web:
    build:
      context: ./flutter_app
      dockerfile: Dockerfile
    container_name: flutter_web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    networks:
      - appnet

  jenkins:
  image: jenkins/jenkins:lts
  container_name: jenkins
  user: root
  ports:
    - "8082:8080"
    - "50000:50000"
  volumes:
    - jenkins_home:/var/jenkins_home
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    - appnet


volumes:
  mongo_data:
    jenkins_home:


networks:
  appnet:
    driver: bridge