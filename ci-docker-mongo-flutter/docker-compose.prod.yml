version: "3.9"

services:
  mongo:
    image: mongo:6
    volumes:
      - mongo_data:/data/db

  backend:
    image: karlsite13/backend-python-ci:latest
    env_file:
      - .env.prod
    depends_on:
      - mongo

  web:
    image: karlsite13/flutter-web:latest

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
      - web

volumes:
  mongo_data:
